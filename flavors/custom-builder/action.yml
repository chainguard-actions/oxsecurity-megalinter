# Automatically @generated by build.py
name: "MegaLinter Custom Flavor Builder"
author: "Nicolas Vuillamy"
description: "Create your own MegaLinter flavor to have even better performances !"
inputs:
  megalinter-custom-flavor-builder-tag:
    description: "Tag of the megalinter-custom-flavor-builder Docker image to use"
    required: true
  platform:
    description: "The platform(s) it will build on"
    required: true
    default: "linux/amd64"
  is-latest:
    description: "Is this the latest version of the custom flavor?"
    required: true
    default: "false"
  upload-to-ghcr:
    description: "Upload the custom flavor to GitHub Container Registry"
    required: true
    default: "false"
  upload-to-dockerhub:
    description: "Upload the custom flavor to DockerHub"
    required: true
    default: "false"
  dockerhub-repo:
    description: "Upload the custom flavor to DockerHub"
    required: false

runs:
  using: "composite"
  steps:
    - name: Build Custom MegaLinter Flavor
      env:
        INPUT_WORKSPACE: ${{ github.workspace }}
        INPUT_GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_BUILD_REPO: ${{ env.CUSTOM_FLAVOR_BUILD_REPO }}
        INPUT_BUILD_REPO_URL: ${{ env.CUSTOM_FLAVOR_BUILD_REPO_URL }}
        INPUT_BUILD_USER: ${{ env.CUSTOM_FLAVOR_BUILD_USER }}
        INPUT_BUILDER_TAG: ${{ inputs.megalinter-custom-flavor-builder-tag }}
      run: |
        # BUILD CUSTOM MEGALINTER FLAVOR
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock:rw \
          -v "${INPUT_WORKSPACE}:/github/workspace" \
            -e GITHUB_TOKEN="${INPUT_GITHUB_TOKEN}" \
            -e CUSTOM_FLAVOR_PLATFORM="${INPUT_PLATFORM}" \
            -e CUSTOM_FLAVOR_BUILD_REPO="${INPUT_BUILD_REPO}" \
            -e CUSTOM_FLAVOR_BUILD_REPO_URL="${INPUT_BUILD_REPO_URL}" \
            -e CUSTOM_FLAVOR_BUILD_USER="${INPUT_BUILD_USER}" \
          "ghcr.io/oxsecurity/megalinter-custom-flavor-builder:${INPUT_BUILDER_TAG}"
      shell: bash
    
    - name: Tag and Push Docker Image
      env:
        INPUT_REPO_OWNER: ${{ github.repository_owner }}
        INPUT_REPO_NAME: ${{ github.event.repository.name }}
        INPUT_REPOSITORY: ${{ github.repository }}
        INPUT_UPLOAD_TO_GHCR: ${{ inputs.upload-to-ghcr }}
        INPUT_IS_LATEST: ${{ inputs.is-latest }}
        INPUT_UPLOAD_TO_DOCKERHUB: ${{ inputs.upload-to-dockerhub }}
      run: |
        # TAG AND PUSH DOCKER IMAGE
        REPO_OWNER=$(echo "${INPUT_REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
        REPO_NAME=$(echo "${INPUT_REPO_NAME}" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME=$(echo "${INPUT_REPOSITORY}" | tr '[:upper:]' '[:lower:]' | tr '/' '_')
        IMAGE_VERSION=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.version"}}' $IMAGE_NAME)
        echo "Custom flavor Image Name: $IMAGE_NAME"
        echo "Custom flavor Image Version: $IMAGE_VERSION"

        if [ "${INPUT_UPLOAD_TO_GHCR}" = "true" ]; then
          echo "Pushing to GitHub Container Registry (GHCR)..."
          docker tag $IMAGE_NAME ghcr.io/$REPO_OWNER/$REPO_NAME/megalinter-custom-flavor:$IMAGE_VERSION
          docker push ghcr.io/$REPO_OWNER/$REPO_NAME/megalinter-custom-flavor:$IMAGE_VERSION
          if [ "${INPUT_IS_LATEST}" = "true" ]; then
            docker tag $IMAGE_NAME ghcr.io/$REPO_OWNER/$REPO_NAME/megalinter-custom-flavor:latest
            docker push ghcr.io/$REPO_OWNER/$REPO_NAME/megalinter-custom-flavor:latest
            echo "Pushed custom flavor image: ghcr.io/$REPO_OWNER/$REPO_NAME/megalinter-custom-flavor:latest"
          fi
          echo "Pushed custom flavor image: ghcr.io/$REPO_OWNER/$REPO_NAME/megalinter-custom-flavor:$IMAGE_VERSION"
        else
          echo "Skipping push to GHCR"
        fi

        if [ "${INPUT_UPLOAD_TO_DOCKERHUB}" = "true" ]; then
          echo "Pushing to DockerHub..."
          DOCKERHUB_IMAGE="$REPO_OWNER/$REPO_NAME-megalinter-custom-flavor"
          docker tag $IMAGE_NAME $DOCKERHUB_IMAGE:$IMAGE_VERSION
          docker push $DOCKERHUB_IMAGE:$IMAGE_VERSION
          if [ "${INPUT_IS_LATEST}" = "true" ]; then
            docker tag $IMAGE_NAME $DOCKERHUB_IMAGE:latest
            docker push $DOCKERHUB_IMAGE:latest
            echo "Pushed custom flavor image: $DOCKERHUB_IMAGE:latest"
          fi
          echo "Pushed custom flavor image: $DOCKERHUB_IMAGE:$IMAGE_VERSION"
        else
          echo "Skipping push to DockerHub"
        fi
      shell: bash

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: megalinter-custom-flavor-artifacts
        path: |
          megalinter-reports/
        retention-days: 90

branding:
  icon: "check"
  color: "green"
