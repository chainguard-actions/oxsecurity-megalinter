name: automerge
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.repository == 'oxsecurity/megalinter'
    steps:
      - name: automerge
        env:
          GITHUB_TOKEN: "${{ secrets.PAT }}"
          MERGE_COMMIT_MESSAGE: "pull-request-description"
          MERGE_FORKS: "false"
        if: env.GITHUB_TOKEN != null
        uses: "pascalgn/automerge-action@8b306ad1983d0ea68c43e27101123e891ecff104" # v0.15.2
