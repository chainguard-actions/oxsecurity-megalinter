name: Test MegaLinter basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: megalinter
        uses: .
        continue-on-error: true
        env:
          # Run only a single fast linter to keep test time short
          ENABLE_LINTERS: MARKDOWN_MARKDOWNLINT
          # Disable applying fixes so the output is predictable
          APPLY_FIXES: none
          # Provide the GitHub token
          GITHUB_TOKEN: ${{ github.token }}
          # Limit to the workspace
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          # Validate all files (not just changed ones) to avoid git-based filtering issues
          VALIDATE_ALL_CODEBASE: "true"
          # Disable reporters that require external services
          REPORTERS: ConsoleLinterReporter
          # Disable GitHub status reporter to avoid API calls on sentinel repo
          GITHUB_STATUS_REPORTER: "false"
          GITHUB_COMMENT_REPORTER: "false"
          # Disable text reporter file output
          TEXT_REPORTER: "false"
          # Disable updated sources reporter
          UPDATED_SOURCES_REPORTER: "false"

      - name: Assert MegaLinter ran
        env:
          OUTCOME: ${{ steps.megalinter.outcome }}
          HAS_UPDATED: ${{ steps.megalinter.outputs.has_updated_sources }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has_updated_sources: $HAS_UPDATED"
          if [ "$OUTCOME" = "success" ]; then
            # Output should be 0 or 1
            if [ "$HAS_UPDATED" != "0" ] && [ "$HAS_UPDATED" != "1" ]; then
              echo "FAIL: expected has_updated_sources to be 0 or 1, got '$HAS_UPDATED'"
              exit 1
            fi
            echo "PASS: has_updated_sources=$HAS_UPDATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: MegaLinter ran (may have found linting issues or encountered resource constraints, which is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
