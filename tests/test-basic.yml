name: Test MegaLinter basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: megalinter
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: "false"
          DISABLE_ERRORS: "true"
          ENABLE_LINTERS: "MARKDOWN_MARKDOWNLINT"
          FILTER_REGEX_INCLUDE: "(tests/)"
          REPORT_OUTPUT_FOLDER: "none"
          MEGALINTER_CONFIG: "none"

      - name: Assert MegaLinter ran and output is valid
        env:
          HAS_UPDATED: ${{ steps.megalinter.outputs.has_updated_sources }}
          OUTCOME: ${{ steps.megalinter.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has_updated_sources: $HAS_UPDATED"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$HAS_UPDATED" != "0" ] && [ "$HAS_UPDATED" != "1" ]; then
              echo "FAIL: expected has_updated_sources to be 0 or 1, got '$HAS_UPDATED'"
              exit 1
            fi
            echo "PASS: MegaLinter ran successfully, has_updated_sources=$HAS_UPDATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: MegaLinter failed gracefully (acceptable in harness environment)"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "PASS: MegaLinter was cancelled (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
