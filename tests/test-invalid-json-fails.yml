name: Test MegaLinter fails on invalid JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          MEGALINTER_CONFIG: tests/fixtures/megalinter/test.mega-linter.yml
          ENABLE_LINTERS: JSON_JSONLINT
          FILTER_REGEX_INCLUDE: 'tests/fixtures/megalinter/invalid/'
          VALIDATE_ALL_CODEBASE: "true"
          APPLY_FIXES: none
          REPORT_OUTPUT_FOLDER: megalinter-reports-invalid
      - name: Assert step failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on invalid JSON"
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/megalinter-reports-invalid" || true
          if [ ! -d "$GITHUB_WORKSPACE/megalinter-reports-invalid" ]; then
            echo "FAIL: report folder not created (action did not actually lint)"
            exit 1
          fi
          echo "PASS"
